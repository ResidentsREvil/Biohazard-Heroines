<!DOCTYPE html>

<html>

<head>

    <meta charset="UTF-8">

    <title>Claire Redfield | Biohazard: Heroines</title>


    <style>

        * {
            box-sizing: border-box;
        }


        body {

            margin: 0;

            background: #080808;

            color: white;

            font-family:
                "Trebuchet MS",
                Arial,
                sans-serif;
        }


        /* =========================
           MUSIC BUTTON
        ========================= */

        .music-button {

            position: fixed;

            top: 25px;
            right: 30px;

            z-index: 9999;

            background:
                rgba(0,0,0,.75);

            color: #aaa;

            border: 1px solid #333;

            padding: 12px 18px;

            font-family:
                "Trebuchet MS",
                Arial,
                sans-serif;

            font-size: 9px;

            letter-spacing: 3px;

            cursor: pointer;

            transition: .3s ease;

            box-shadow:
                0 0 15px rgba(0,0,0,.5);
        }


        .music-button:hover {

            color: white;

            border-color: #d71920;

            background: #120608;

            box-shadow:
                0 0 20px rgba(215,25,32,.35);
        }


        .music-button.playing {

            color: #d71920;

            border-color: #d71920;

            text-shadow:
                0 0 10px rgba(215,25,32,.7);

            box-shadow:
                0 0 20px rgba(215,25,32,.25);
        }


        /* =========================
           HEADER
        ========================= */

        header {

            padding: 25px 50px;

            border-bottom: 1px solid #333;

            display: flex;

            justify-content: space-between;

            align-items: center;
        }


        header h1 {

            margin: 0;

            color: #d71920;

            font-size: 24px;

            letter-spacing: 2px;

            text-shadow:
                0 0 8px rgba(215,25,32,.5);
        }


        .back {

            color: white;

            text-decoration: none;

            border: 1px solid #444;

            padding: 10px 18px;

            transition: .3s;
        }


        .back:hover {

            color: #d71920;

            border-color: #d71920;

            box-shadow:
                0 0 12px rgba(215,25,32,.25);
        }


        /* =========================
           MAIN HERO
        ========================= */

        .hero {

            min-height: 750px;

            display: flex;

            justify-content: center;

            align-items: center;

            text-align: center;

            padding: 80px 30px;

            background:

                radial-gradient(

                    circle at center,

                    #18090b 0%,

                    #080808 65%

                );
        }


        .hero-content {

            width: 100%;

            max-width: 1000px;
        }


        /* =========================
           CLAIRE NAME
        ========================= */

        .hero h2 {

            margin: 0 0 45px;

            font-size: 90px;

            font-weight: 700;

            letter-spacing: 4px;

            line-height: 1;

            color: white;

            text-shadow:
                0 0 10px rgba(255,255,255,.3);
        }


        .hero h2 span {

            color: #d71920;

            text-shadow:

                0 0 10px rgba(215,25,32,.7),

                0 0 25px rgba(215,25,32,.35);
        }


        /* =========================
           TYPEWRITER
        ========================= */

        .typewriter {

            display: inline-block;

            overflow: hidden;

            white-space: nowrap;

            width: 0;

            border-right:
                3px solid #d71920;

            animation:

                typingLoop
                5s
                steps(30, end)
                infinite,

                cursorBlink
                .7s
                step-end
                infinite;
        }


        @keyframes typingLoop {

            0% {
                width: 0;
            }

            40% {
                width: 100%;
            }

            60% {
                width: 100%;
            }

            100% {
                width: 0;
            }
        }


        @keyframes cursorBlink {

            50% {
                border-color: transparent;
            }
        }


        /* =========================
           CLAIRE ARCHIVE IMAGE
        ========================= */

        .archive-card {

            position: relative;

            width: 100%;

            max-width: 900px;

            height: 450px;

            margin: 0 auto;

            overflow: hidden;

            border: 1px solid #333;

            background: #111;

            transition:

                border-color .4s ease,

                box-shadow .4s ease;
        }


        .archive-card img {

            width: 100%;

            height: 100%;

            object-fit: cover;

            object-position: center 35%;

            display: block;

            transition:

                transform .7s ease,

                opacity .5s ease;
        }


        /* =========================
           IMAGE OVERLAY
        ========================= */

        .archive-overlay {

            position: absolute;

            inset: 0;

            display: flex;

            flex-direction: column;

            justify-content: center;

            align-items: center;

            padding: 30px;

            background:

                linear-gradient(

                    rgba(0,0,0,.12),

                    rgba(0,0,0,.78)

                );

            transition:

                background .4s ease;
        }


        /* =========================
           RESIDENT EVIL 2 REMAKE
        ========================= */

        .incident {

            margin: 0 0 30px;

            color: white;

            font-size: 28px;

            font-weight: bold;

            letter-spacing: 4px;

            text-transform: uppercase;

            text-shadow:

                0 0 10px rgba(255,255,255,.4);
        }


        /* =========================
           ENTER ARCHIVE
        ========================= */

        .enter {

            color: white;

            text-decoration: none;

            border: 1px solid white;

            padding: 16px 38px;

            font-size: 13px;

            letter-spacing: 4px;

            background:

                rgba(0,0,0,.5);

            transition: .35s;
        }


        /* =========================
           HOVER
        ========================= */

        .archive-card:hover {

            border-color: #d71920;

            box-shadow:

                0 0 25px
                rgba(215,25,32,.18);
        }


        .archive-card:hover img {

            transform: scale(1.05);

            opacity: .82;
        }


        .archive-card:hover .archive-overlay {

            background:

                linear-gradient(

                    rgba(0,0,0,.2),

                    rgba(0,0,0,.84)

                );
        }


        .archive-card:hover .enter {

            color: #d71920;

            border-color: #d71920;

            box-shadow:

                0 0 18px
                rgba(215,25,32,.45);
        }


        /* =========================
           FOOTER
        ========================= */

        footer {

            border-top: 1px solid #333;

            padding: 30px 50px;

            color: #666;

            font-size: 12px;

            letter-spacing: 1px;

            text-align: center;
        }


        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 700px) {

            header {

                padding: 20px;

                flex-direction: column;

                gap: 20px;
            }


            .music-button {

                top: 15px;

                right: 15px;
            }


            .hero {

                padding: 60px 20px;
            }


            .hero h2 {

                font-size: 52px;

                margin-bottom: 35px;
            }


            .archive-card {

                height: 350px;
            }


            .incident {

                font-size: 20px;

                letter-spacing: 2px;
            }

        }

    </style>

</head>


<body>


<!-- =========================
     MUSIC
========================= -->

<audio
    id="backgroundMusic"
    src="music.mp3"
    loop
    preload="auto">
</audio>


<button
    id="musicButton"
    class="music-button"
    onclick="toggleMusic()"
>

    ♪ MUSIC OFF

</button>


<!-- =========================
     HEADER
========================= -->

<header>

    <h1>

        BIOHAZARD: HEROINES

    </h1>


    <a
        href="index.html"
        class="back"
    >

        ← BACK TO HEROINES

    </a>

</header>


<!-- =========================
     CLAIRE LANDING PAGE
========================= -->

<section class="hero">

    <div class="hero-content">


        <!-- CLAIRE NAME -->

        <h2 class="typewriter">

            CLAIRE

            <span>

                REDFIELD

            </span>

        </h2>


        <!-- LARGE CLAIRE CARD -->

        <div class="archive-card">


            <img
                src="images/claire.jpg"
                alt="Claire Redfield"
            >


            <div class="archive-overlay">


                <h3 class="incident">

                    RESIDENT EVIL 2 REMAKE

                </h3>


                <a
                    href="clairere2.html"
                    class="enter"
                >

                    ENTER ARCHIVE

                </a>


            </div>

        </div>


    </div>

</section>


<!-- =========================
     FOOTER
========================= -->

<footer>

    BIOHAZARD: HEROINES —
    UNOFFICIAL FAN ARCHIVE

</footer>


<!-- =========================
     JAVASCRIPT
========================= -->

<script>


/* =========================
   MUSIC SYSTEM
========================= */

const music =
    document.getElementById(
        "backgroundMusic"
    );


const musicButton =
    document.getElementById(
        "musicButton"
    );


/* SAVED STATE */

const savedTime =
    localStorage.getItem(
        "musicTime"
    );


const savedState =
    localStorage.getItem(
        "musicPlaying"
    );


/* =========================
   RESTORE MUSIC POSITION
========================= */

if (savedTime !== null) {

    music.addEventListener(

        "loadedmetadata",

        function() {

            try {

                music.currentTime =
                    parseFloat(savedTime);

            } catch (error) {}

        },

        { once: true }

    );

}


/* =========================
   UPDATE BUTTON
========================= */

function updateMusicButton() {

    if (!music.paused) {

        musicButton.textContent =
            "♪ MUSIC ON";

        musicButton.classList.add(
            "playing"
        );

    } else {

        musicButton.textContent =
            "♪ MUSIC OFF";

        musicButton.classList.remove(
            "playing"
        );

    }

}


/* =========================
   START MUSIC
========================= */

function startMusic() {

    music.play()

        .then(function() {

            localStorage.setItem(
                "musicPlaying",
                "true"
            );

            updateMusicButton();

        })

        .catch(function() {

            /*
                Browser may block autoplay.
                Clicking anywhere can start it.
            */

        });

}


/* =========================
   TOGGLE MUSIC
========================= */

function toggleMusic() {

    if (music.paused) {

        startMusic();

    } else {

        music.pause();

        localStorage.setItem(
            "musicPlaying",
            "false"
        );

        updateMusicButton();

    }

}


/* =========================
   SAVE MUSIC POSITION
========================= */

setInterval(function() {

    if (!music.paused) {

        localStorage.setItem(
            "musicTime",
            music.currentTime
        );

    }

}, 1000);


/* =========================
   SAVE BEFORE LEAVING
========================= */

window.addEventListener(

    "beforeunload",

    function() {

        localStorage.setItem(
            "musicTime",
            music.currentTime
        );


        localStorage.setItem(

            "musicPlaying",

            music.paused
                ? "false"
                : "true"

        );

    }

);


/* =========================
   RESUME MUSIC
========================= */

if (savedState === "true") {

    window.addEventListener(

        "load",

        function() {

            startMusic();

        }

    );

}


/* =========================
   FIRST CLICK FALLBACK
========================= */

document.addEventListener(

    "click",

    function() {

        if (

            savedState === "true" &&

            music.paused

        ) {

            startMusic();

        }

    },

    { once: true }

);


updateMusicButton();

</script>


</body>

</html>
