<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Ada Wong — RE4 Remake Pictures</title>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    background: #050505;
    color: white;
    font-family: "Trebuchet MS", Arial, sans-serif;
    min-height: 100vh;
}


/* =========================
   LOADING SCREEN
========================= */

#archiveLoader {
    position: fixed;
    inset: 0;
    z-index: 10000;

    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;

    background: #050505;

    opacity: 1;
    visibility: visible;

    transition:
        opacity .8s ease,
        visibility .8s ease;
}

#archiveLoader.hidden {
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
}

.archive-loader-label {
    color: #666;
    font-size: 9px;
    letter-spacing: 5px;
    margin-bottom: 18px;
}

.archive-loader-title {
    color: #d71920;
    font-size: 25px;
    letter-spacing: 6px;

    text-shadow:
        0 0 15px rgba(215,25,32,.5),
        0 0 35px rgba(215,25,32,.2);
}

.archive-loader-percentage {
    margin-top: 20px;
    color: #aaa;
    font-size: 11px;
    letter-spacing: 4px;
    min-width: 50px;
    text-align: center;
}

.archive-loader-line {
    width: 260px;
    height: 1px;
    margin-top: 20px;
    background: #292929;
    overflow: hidden;
}

.archive-loader-progress {
    width: 0;
    height: 100%;
    background: #d71920;

    box-shadow:
        0 0 12px rgba(215,25,32,.8);
}

.archive-loader-status {
    margin-top: 16px;
    color: #444;
    font-size: 8px;
    letter-spacing: 3px;
}


/* =========================
   MUSIC
========================= */

.music-button {
    position: fixed;
    top: 25px;
    right: 30px;

    z-index: 9999;

    background: rgba(0,0,0,.75);

    color: #aaa;

    border: 1px solid #333;

    padding: 12px 18px;

    font-family:
        "Trebuchet MS",
        Arial,
        sans-serif;

    font-size: 9px;
    letter-spacing: 3px;

    cursor: pointer;

    transition: .3s ease;
}

.music-button:hover {
    color: white;
    border-color: #d71920;

    background: #120608;

    box-shadow:
        0 0 20px rgba(215,25,32,.35);
}

.music-button.playing {
    color: #d71920;
    border-color: #d71920;

    text-shadow:
        0 0 10px rgba(215,25,32,.7);

    box-shadow:
        0 0 20px rgba(215,25,32,.25);
}


/* =========================
   BACK
========================= */

.back {
    position: fixed;

    top: 25px;
    left: 30px;

    color: #777;

    text-decoration: none;

    font-size: 11px;
    letter-spacing: 3px;

    z-index: 20;

    transition: .3s;
}

.back:hover {
    color: #d71920;
}


/* =========================
   HEADER
========================= */

header {
    text-align: center;

    padding: 105px 20px 45px;

    border-bottom: 1px solid #242424;

    background:
        radial-gradient(
            circle,
            rgba(130, 0, 15, .17),
            transparent 65%
        );
}

.small-title {
    color: #777;

    font-size: 10px;

    letter-spacing: 6px;

    margin-bottom: 18px;
}

h1 {
    display: inline-block;

    overflow: hidden;

    white-space: nowrap;

    width: 0;

    border-right: 3px solid #d71920;

    font-size: clamp(40px, 6vw, 70px);

    letter-spacing: 5px;

    color: #d71920;

    text-shadow:
        0 0 10px rgba(215,25,32,.5);

    animation:
        adaTyping 5s steps(18, end) infinite,
        cursorBlink .7s step-end infinite;
}

.subtitle {
    color: #777;

    font-size: 11px;

    letter-spacing: 4px;

    margin-top: 18px;
}


/* =========================
   PICTURE ARCHIVE
========================= */

.picture-archive {
    width: 88%;
    max-width: 1100px;

    margin: 55px auto 90px;

    position: relative;
}


/* =========================
   MAIN IMAGE
========================= */

.main-picture {
    position: relative;

    width: 100%;

    height: 620px;

    background: #090909;

    border: 1px solid #292929;

    display: flex;

    align-items: center;

    justify-content: center;

    overflow: hidden;
}

.main-picture img {
    width: 100%;
    height: 100%;

    object-fit: contain;

    display: block;

    transition:
        opacity .25s ease,
        transform .35s ease;
}


/* =========================
   ARROWS
========================= */

.archive-arrow {
    position: absolute;

    top: 50%;

    transform: translateY(-50%);

    width: 58px;
    height: 80px;

    display: flex;

    align-items: center;
    justify-content: center;

    background: rgba(0,0,0,.7);

    border: 1px solid #333;

    color: #888;

    font-size: 25px;

    cursor: pointer;

    z-index: 5;

    transition: .3s ease;
}

.archive-arrow:hover {
    color: #d71920;

    border-color: #d71920;

    background: rgba(20,0,3,.85);

    box-shadow:
        0 0 20px rgba(215,25,32,.3);
}

#prevArrow {
    left: 20px;
}

#nextArrow {
    right: 20px;
}


/* =========================
   IMAGE INFO
========================= */

.picture-info {
    display: flex;

    justify-content: space-between;

    align-items: center;

    margin-top: 18px;

    padding: 0 5px;
}

.picture-label {
    color: #777;

    font-size: 10px;

    letter-spacing: 4px;
}

.picture-counter {
    color: #d71920;

    font-size: 10px;

    letter-spacing: 4px;
}


/* =========================
   THUMBNAILS
========================= */

.thumbnail-container {
    display: flex;

    justify-content: center;

    gap: 10px;

    margin-top: 25px;

    flex-wrap: wrap;
}

.thumbnail {
    width: 105px;
    height: 65px;

    object-fit: cover;

    border: 1px solid #333;

    opacity: .45;

    cursor: pointer;

    transition: .3s ease;
}

.thumbnail:hover {
    opacity: .8;

    border-color: #777;
}

.thumbnail.active {
    opacity: 1;

    border-color: #d71920;

    box-shadow:
        0 0 12px rgba(215,25,32,.35);
}


/* =========================
   FULLSCREEN VIEWER
========================= */

#imageViewer {
    display: none;

    position: fixed;

    inset: 0;

    background: rgba(0,0,0,.97);

    z-index: 20000;

    align-items: center;

    justify-content: center;
}

#fullscreenImage {
    max-width: 85%;
    max-height: 82vh;

    object-fit: contain;

    transition:
        opacity .2s ease;
}


/* =========================
   FULLSCREEN CLOSE
========================= */

.close-viewer {
    position: absolute;

    top: 25px;
    right: 30px;

    color: #777;

    font-size: 28px;

    cursor: pointer;

    z-index: 5;

    transition: .3s;
}

.close-viewer:hover {
    color: #d71920;
}


/* =========================
   FULLSCREEN ARROWS
========================= */

.fullscreen-arrow {
    position: absolute;

    top: 50%;

    transform: translateY(-50%);

    width: 55px;
    height: 75px;

    background: rgba(0,0,0,.65);

    border: 1px solid #333;

    color: #888;

    font-size: 25px;

    cursor: pointer;

    z-index: 5;

    transition: .3s;
}

.fullscreen-arrow:hover {
    color: #d71920;

    border-color: #d71920;

    box-shadow:
        0 0 20px rgba(215,25,32,.3);
}

#fullscreenPrev {
    left: 25px;
}

#fullscreenNext {
    right: 25px;
}


/* =========================
   FULLSCREEN COUNTER
========================= */

.fullscreen-counter {
    position: absolute;

    top: 28px;
    left: 30px;

    color: #d71920;

    font-size: 10px;

    letter-spacing: 4px;

    z-index: 5;
}


/* =========================
   FOOTER
========================= */

footer {
    border-top: 1px solid #1c1c1c;

    text-align: center;

    padding: 45px;

    color: #444;

    font-size: 9px;

    letter-spacing: 4px;
}


/* =========================
   ANIMATIONS
========================= */

@keyframes adaTyping {

    0% {
        width: 0;
    }

    40% {
        width: 100%;
    }

    60% {
        width: 100%;
    }

    100% {
        width: 0;
    }

}

@keyframes cursorBlink {

    50% {
        border-color: transparent;
    }

}


/* =========================
   MOBILE
========================= */

@media (max-width: 800px) {

    .picture-archive {
        width: 92%;
    }

    .main-picture {
        height: 480px;
    }

    .thumbnail {
        width: 80px;
        height: 52px;
    }

}


@media (max-width: 550px) {

    .music-button {
        top: 55px;
        right: 15px;

        padding: 10px 12px;

        font-size: 8px;
    }

    .back {
        top: 18px;
        left: 18px;

        font-size: 9px;
    }

    .main-picture {
        height: 350px;
    }

    .archive-arrow {
        width: 42px;
        height: 58px;

        font-size: 20px;
    }

    #prevArrow {
        left: 10px;
    }

    #nextArrow {
        right: 10px;
    }

    .thumbnail {
        width: 58px;
        height: 40px;
    }

    #fullscreenImage {
        max-width: 75%;
        max-height: 70vh;
    }

}

</style>

</head>


<body>


<!-- =========================
     LOADING SCREEN
========================= -->

<div id="archiveLoader">

    <div class="archive-loader-label">
        RESIDENT EVIL 4 REMAKE
    </div>

    <div class="archive-loader-title">
        LOADING ARCHIVE
    </div>

    <div class="archive-loader-percentage">
        <span id="loadingPercentage">0</span>%
    </div>

    <div class="archive-loader-line">

        <div
            class="archive-loader-progress"
            id="archiveProgress">
        </div>

    </div>

    <div
        class="archive-loader-status"
        id="loadingStatus">

        INITIALIZING SYSTEM

    </div>

</div>


<!-- =========================
     MUSIC
========================= -->

<audio
    id="backgroundMusic"
    src="music.mp3"
    loop
    preload="auto">
</audio>


<button
    id="musicButton"
    class="music-button"
    onclick="toggleMusic()"
>
    ♪ MUSIC OFF
</button>


<!-- =========================
     BACK
========================= -->

<a
    href="adare4.html"
    class="back"
>
    ← BACK TO RE4
</a>


<!-- =========================
     HEADER
========================= -->

<header>

    <div class="small-title">
        RESIDENT EVIL 4 REMAKE
    </div>

    <h1>
        ADA WONG
    </h1>

    <div class="subtitle">
        PICTURES
    </div>

</header>


<!-- =========================
     DEFAULT PICTURE VIEWER
========================= -->

<main class="picture-archive">


    <div class="main-picture">


        <button
            class="archive-arrow"
            id="prevArrow"
            onclick="previousImage()"
        >
            ←
        </button>


        <img
            id="mainImage"
            src="images/ja.jpg"
            alt="Ada Wong RE4 Remake"
            onclick="openFullscreen()"
            style="cursor: zoom-in;"
        >


        <button
            class="archive-arrow"
            id="nextArrow"
            onclick="nextImage()"
        >
            →
        </button>


    </div>


    <div class="picture-info">

        <div
            class="picture-label"
            id="pictureLabel"
        >
            ADA WONG / RE4 REMAKE
        </div>

        <div
            class="picture-counter"
            id="pictureCounter"
        >
            01 / 06
        </div>

    </div>


    <!-- THUMBNAILS -->

    <div class="thumbnail-container">


        <img
            class="thumbnail active"
            src="images/ja.jpg"
            onclick="showImage(0)"
            alt="Ada Wong thumbnail 1"
        >


        <img
            class="thumbnail"
            src="images/du.jpg"
            onclick="showImage(1)"
            alt="Ada Wong thumbnail 2"
        >


        <img
            class="thumbnail"
            src="images/kha.jpg"
            onclick="showImage(2)"
            alt="Ada Wong thumbnail 3"
        >


        <img
            class="thumbnail"
            src="images/re4.jpg"
            onclick="showImage(3)"
            alt="Ada Wong thumbnail 4"
        >


        <img
            class="thumbnail"
            src="images/adare4.jpg"
            onclick="showImage(4)"
            alt="Ada Wong thumbnail 5"
        >


        <img
            class="thumbnail"
            src="images/download.jpg"
            onclick="showImage(5)"
            alt="Ada Wong thumbnail 6"
        >


    </div>


</main>


<!-- =========================
     FULLSCREEN VIEWER
========================= -->

<div id="imageViewer">


    <div
        class="fullscreen-counter"
        id="fullscreenCounter"
    >
        01 / 06
    </div>


    <div
        class="close-viewer"
        onclick="closeFullscreen()"
    >
        ×
    </div>


    <button
        class="fullscreen-arrow"
        id="fullscreenPrev"
        onclick="fullscreenPrevious(event)"
    >
        ←
    </button>


    <img
        id="fullscreenImage"
        src="images/ja.jpg"
        alt="Large Ada Wong image"
    >


    <button
        class="fullscreen-arrow"
        id="fullscreenNext"
        onclick="fullscreenNext(event)"
    >
        →
    </button>


</div>


<!-- =========================
     FOOTER
========================= -->

<footer>

    BIOHAZARD: HEROINES — ADA WONG / RE4 REMAKE

</footer>


<script>


/* =========================
   IMAGE DATA
========================= */

const galleryImages = [

    "images/ja.jpg",

    "images/du.jpg",

    "images/kha.jpg",

    "images/re4.jpg",

    "images/adare4.jpg",

    "images/download.jpg"

];


let currentImage = 0;


/* =========================
   SHOW IMAGE
========================= */

function showImage(index) {

    currentImage = index;

    const mainImage =
        document.getElementById("mainImage");

    const thumbnails =
        document.querySelectorAll(".thumbnail");

    const counter =
        document.getElementById("pictureCounter");

    const fullscreenCounter =
        document.getElementById("fullscreenCounter");


    mainImage.style.opacity = "0";


    setTimeout(function() {

        mainImage.src =
            galleryImages[currentImage];

        mainImage.style.opacity = "1";


    }, 120);


    thumbnails.forEach(function(
        thumbnail,
        thumbnailIndex
    ) {

        thumbnail.classList.toggle(
            "active",
            thumbnailIndex === currentImage
        );

    });


    const number =
        String(currentImage + 1)
        .padStart(2, "0");


    counter.textContent =
        number + " / 06";


    fullscreenCounter.textContent =
        number + " / 06";

}


/* =========================
   NEXT
========================= */

function nextImage() {

    currentImage++;

    if (
        currentImage >=
        galleryImages.length
    ) {

        currentImage = 0;

    }

    showImage(currentImage);

}


/* =========================
   PREVIOUS
========================= */

function previousImage() {

    currentImage--;

    if (currentImage < 0) {

        currentImage =
            galleryImages.length - 1;

    }

    showImage(currentImage);

}


/* =========================
   FULLSCREEN
========================= */

function openFullscreen() {

    const viewer =
        document.getElementById(
            "imageViewer"
        );

    const fullscreenImage =
        document.getElementById(
            "fullscreenImage"
        );


    fullscreenImage.src =
        galleryImages[currentImage];


    viewer.style.display =
        "flex";

}


function closeFullscreen() {

    document.getElementById(
        "imageViewer"
    ).style.display = "none";

}


/* =========================
   FULLSCREEN NEXT
========================= */

function fullscreenNext(event) {

    if (event) {

        event.stopPropagation();

    }

    nextImage();

    document.getElementById(
        "fullscreenImage"
    ).src =
        galleryImages[currentImage];

}


/* =========================
   FULLSCREEN PREVIOUS
========================= */

function fullscreenPrevious(event) {

    if (event) {

        event.stopPropagation();

    }

    previousImage();

    document.getElementById(
        "fullscreenImage"
    ).src =
        galleryImages[currentImage];

}


/* =========================
   KEYBOARD CONTROLS
========================= */

document.addEventListener(
    "keydown",
    function(event) {

        const viewer =
            document.getElementById(
                "imageViewer"
            );


        if (
            viewer.style.display === "flex"
        ) {

            if (
                event.key === "ArrowRight"
            ) {

                fullscreenNext();

            }


            if (
                event.key === "ArrowLeft"
            ) {

                fullscreenPrevious();

            }


            if (
                event.key === "Escape"
            ) {

                closeFullscreen();

            }

        } else {

            if (
                event.key === "ArrowRight"
            ) {

                nextImage();

            }


            if (
                event.key === "ArrowLeft"
            ) {

                previousImage();

            }

        }

    }
);


/* =========================
   LOADING SCREEN
========================= */

const archiveLoader =
    document.getElementById(
        "archiveLoader"
    );

const archiveProgress =
    document.getElementById(
        "archiveProgress"
    );

const loadingPercentage =
    document.getElementById(
        "loadingPercentage"
    );

const loadingStatus =
    document.getElementById(
        "loadingStatus"
    );


let loadingValue = 0;


const loadingStatuses = [

    {
        percent: 15,
        text: "INITIALIZING SYSTEM"
    },

    {
        percent: 35,
        text: "ACCESSING ARCHIVE"
    },

    {
        percent: 55,
        text: "LOADING VISUAL FILES"
    },

    {
        percent: 75,
        text: "VERIFYING DATA"
    },

    {
        percent: 90,
        text: "PREPARING ARCHIVE"
    },

    {
        percent: 100,
        text: "ARCHIVE READY"
    }

];


const loadingInterval =
    setInterval(function() {

        loadingValue++;

        loadingPercentage.textContent =
            loadingValue;

        archiveProgress.style.width =
            loadingValue + "%";


        for (
            let i = loadingStatuses.length - 1;
            i >= 0;
            i--
        ) {

            if (
                loadingValue >=
                loadingStatuses[i].percent
            ) {

                loadingStatus.textContent =
                    loadingStatuses[i].text;

                break;

            }

        }


        if (loadingValue >= 100) {

            clearInterval(
                loadingInterval
            );

            setTimeout(function() {

                archiveLoader.classList.add(
                    "hidden"
                );

            }, 450);

        }

    }, 25);


/* =========================
   MUSIC SYSTEM
========================= */

const music =
    document.getElementById(
        "backgroundMusic"
    );

const musicButton =
    document.getElementById(
        "musicButton"
    );


const savedTime =
    localStorage.getItem(
        "musicTime"
    );

const savedState =
    localStorage.getItem(
        "musicPlaying"
    );


/* Restore music position */

if (savedTime !== null) {

    music.addEventListener(
        "loadedmetadata",
        function() {

            try {

                music.currentTime =
                    parseFloat(savedTime);

            } catch (error) {}

        },
        { once: true }
    );

}


/* Update button */

function updateMusicButton() {

    if (!music.paused) {

        musicButton.textContent =
            "♪ MUSIC ON";

        musicButton.classList.add(
            "playing"
        );

    } else {

        musicButton.textContent =
            "♪ MUSIC OFF";

        musicButton.classList.remove(
            "playing"
        );

    }

}


/* Start */

function startMusic() {

    music.play()
        .then(function() {

            localStorage.setItem(
                "musicPlaying",
                "true"
            );

            updateMusicButton();

        })
        .catch(function() {});

}


/* Toggle */

function toggleMusic() {

    if (music.paused) {

        startMusic();

    } else {

        music.pause();

        localStorage.setItem(
            "musicPlaying",
            "false"
        );

        updateMusicButton();

    }

}


/* Save position */

setInterval(function() {

    if (!music.paused) {

        localStorage.setItem(
            "musicTime",
            music.currentTime
        );

    }

}, 1000);


/* Save before leaving */

window.addEventListener(
    "beforeunload",
    function() {

        localStorage.setItem(
            "musicTime",
            music.currentTime
        );

        localStorage.setItem(
            "musicPlaying",
            music.paused
                ? "false"
                : "true"
        );

    }
);


/* Continue music */

if (savedState === "true") {

    window.addEventListener(
        "load",
        function() {

            startMusic();

        }
    );

}


/* First-click fallback */

document.addEventListener(
    "click",
    function() {

        if (
            savedState === "true" &&
            music.paused
        ) {

            startMusic();

        }

    },
    { once: true }
);


updateMusicButton();


/* =========================
   PRELOAD ALL IMAGES
========================= */

galleryImages.forEach(function(src) {

    const image =
        new Image();

    image.src = src;

});


/* =========================
   START WITH FIRST IMAGE
========================= */

showImage(0);

</script>


</body>

</html>
